services:
  - type: web
    name: dayflow-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: dayflow-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/dayflow.sqlite
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
